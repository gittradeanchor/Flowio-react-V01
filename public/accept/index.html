<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Old domain -> new home. Keeps path, query and hash so old accept, booking and demo links still land correctly.
      (function () {
        var h = location.hostname;
        if (h === 'tradeanchor.com.au' || h === 'www.tradeanchor.com.au') {
          location.replace('https://flowio.tradeanchor.com.au' + location.pathname + location.search + location.hash);
        }
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <style>
      /* Ensure the iframe takes up the full mobile screen */
      body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      iframe { width: 100%; height: 100%; border: none; }
    </style>
  </head>
  
  <body>
    <iframe id="gas-frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"></iframe>
    
    <script>
      // 1) Your GAS Web App URL
      // Updated 23 Sept 2026: the founder redeployed demo_delivery_code.gs under a NEW deployment ID.
      // This file has no build step — it's a static asset copied as-is — so it must be edited by hand
      // every time the deployment ID changes. There is no other place in the site code that needs this URL:
      // VITE_GSCRIPT_URL and VITE_GSCRIPT_PRICEBOOK_URL are separate, Cloudflare Pages-side variables.
      const GAS_BASE = "https://script.google.com/macros/s/AKfycbwRJwWn-qfjRJ2twKG7Dv8b0oiyAf8E9GcaNsSbftxYZ0G0rCVfDbf-GTvhIr3WcO08/exec";

      // 2) Pass through the query params
      const qs = window.location.search || "";
      const target = GAS_BASE + qs;
      
      // 3) Instead of redirecting the window, we set the iframe source
      document.getElementById('gas-frame').src = target;
    </script>
  </body>
</html>
