<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Old domain -> new home. Keeps path, query and hash so old accept, booking and demo links still land correctly.
      (function () {
        var h = location.hostname;
        if (h === 'tradeanchor.com.au' || h === 'www.tradeanchor.com.au') {
          location.replace('https://flowio.tradeanchor.com.au' + location.pathname + location.search + location.hash);
        }
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeAnchor — Stop Doing Paperwork at 9PM</title>
    <meta name="description" content="Done-for-you quoting for Australian electricians, inside the Google Sheet you already use. Send a quote, your customer accepts on their phone, and you confirm the job into your calendar." />
  </head>
  <body class="bg-white text-text-main antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
